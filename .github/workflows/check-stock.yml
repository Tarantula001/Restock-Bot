name: Check FirstCry stock

on:
  schedule:
    # GitHub's own scheduler is best-effort and can be delayed by a lot —
    # this is kept only as a loose backup. The real, reliable schedule is
    # driven externally via cron-job.org calling workflow_dispatch below
    # (see README.md, section C).
    - cron: "13 * * * *"
  workflow_dispatch: {}  # triggered manually, or by an external scheduler (cron-job.org)

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # Caches the downloaded Chromium browser so most runs don't have to
      # re-download it — this is what keeps each run fast and cheap.
      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ runner.os }}

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      # state.json remembers what was last seen in/out of stock, so you
      # only get notified on a *change*, not every run.
      - name: Restore watch state
        uses: actions/cache@v4
        with:
          path: state.json
          key: restock-state-${{ github.run_id }}
          restore-keys: |
            restock-state-

      - name: Run stock check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python bot.py

      - name: Save watch state
        uses: actions/cache@v4
        with:
          path: state.json
          key: restock-state-${{ github.run_id }}
